[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hometown"
version = "0.1.0"
description = "Os 5.571 municípios brasileiros offline: transforme nomes digitados de qualquer jeito em códigos IBGE, com UF, DDD, coordenadas e busca tolerante a erros."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/hometown/dados/NOTICE.md"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["ibge", "municipios", "hometown", "brasil", "geocoding", "dados abertos", "fuzzy matching", "pandas", "cidades"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/yagodejesus/hometown"
Issues = "https://github.com/yagodejesus/hometown/issues"

[project.scripts]
hometown = "hometown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hometown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
